[project]
name = "plumbline"
version = "0.1.0"
description = "Check whether APIs are true to their contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "jsonschema>=4.23",
    "mcp>=1.0",
    "openapi-spec-validator>=0.7",
    "prance>=25.4",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/plumbline"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
