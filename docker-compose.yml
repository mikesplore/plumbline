services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./runs:/app/runs
      - ./.plumbline:/app/.plumbline
    restart: unless-stopped

  mcp:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - ./.plumbline:/app/.plumbline
    depends_on:
      - backend
    environment:
      - PLUMBLINE_MCP_CLIENT_ID=${MCP_CLIENT_ID:-myid}
      - PLUMBLINE_MCP_CLIENT_SECRET=${MCP_CLIENT_SECRET:-mysecret}
      - PLUMBLINE_PUBLIC_URL=${PLUMBLINE_PUBLIC_URL:-}
      - PLUMBLINE_OAUTH_REDIRECT_URIS=${PLUMBLINE_OAUTH_REDIRECT_URIS:-https://claude.ai/api/mcp/auth_callback}
    command: uv run --no-sync python -m plumbline.mcp_server --spec /app/.plumbline/current-openapi.txt --base-url ${MCP_BASE_URL:-http://backend:8000} --transport http --host 0.0.0.0 --port 8765
    restart: unless-stopped
